version: '3.9'

networks:
  carwager-network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: carwager
      POSTGRES_USER: carwager
      POSTGRES_PASSWORD: carwager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwager"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carwager-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - carwager-network


  django:
   build: .
   command: sh -c "sleep 3 && python manage.py runserver 0.0.0.0:8000 && 
            python manage.py run_status_update &&
            python manage.py search_winners"
   volumes:
     - ./carwager/:/app/
     - static_volume:/app/staticfiles
     - media_volume:/app/media
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy
   environment:
     DEBUG: "True"
     POSTGRES_NAME: carwager
     POSTGRES_USER: carwager
     POSTGRES_PASS: carwager
     POSTGRES_HOST: postgres
     REDIS_HOST: redis
   expose:
     - 8000
   restart: on-failure
   networks:
     - carwager-network

  worker:
   build: .
   command: sh -c 'sleep 5 && python manage.py start_worker default'
   volumes:
     - ./carwager/:/app/
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy
   environment:
     POSTGRES_NAME: carwager
     POSTGRES_USER: carwager
     POSTGRES_PASS: carwager
     POSTGRES_HOST: postgres
     REDIS_HOST: redis
   restart: on-failure
   networks:
     - carwager-network

  scheduler:
   build: .
   command: sh -c 'sleep 10 && python manage.py start_scheduler default'
   volumes:
     - ./carwager/:/app/
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy
   environment:
     POSTGRES_NAME: carwager
     POSTGRES_USER: carwager
     POSTGRES_PASS: carwager
     POSTGRES_HOST: postgres
     REDIS_HOST: redis
   restart: on-failure
   networks:
     - carwager-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
     - "8080:80"
    volumes:
     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
     - static_volume:/app/staticfiles:ro
     - media_volume:/app/media:ro
    depends_on:
     - django
    networks:
     - carwager-network

volumes:
  postgres_data:
  static_volume:
  media_volume:
