version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: carwager
      POSTGRES_USER: carwager
      POSTGRES_PASSWORD: carwager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwager"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"


  django:
   build: .
   volumes:
     - ./carwager/:/app/
     - static_volume:/app/staticfiles
     - media_volume:/app/media
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy
   environment:
     DEBUG: "True"
     POSTGRES_NAME: carwager
     POSTGRES_USER: carwager
     POSTGRES_PASS: carwager
     POSTGRES_HOST: postgres
     REDIS_HOST: redis
   expose:
     - 8000

  worker:
   build: .
   command: python manage.py rqworker default
   volumes:
     - ./carwager/:/app/
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy
   environment:
     POSTGRES_NAME: carwager
     POSTGRES_USER: carwager
     POSTGRES_PASS: carwager
     POSTGRES_HOST: postgres
     REDIS_HOST: redis

  scheduler:
   build: .
   command: python manage.py rqscheduler default
   volumes:
     - ./carwager/:/app/
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy
   environment:
     POSTGRES_NAME: carwager
     POSTGRES_USER: carwager
     POSTGRES_PASS: carwager
     POSTGRES_HOST: postgres
     REDIS_HOST: redis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
     - "8080:80"
    volumes:
     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
     - static_volume:/app/staticfiles:ro
     - media_volume:/app/media:ro
    depends_on:
     - django
    networks:
     - default

volumes:
  postgres_data:
  static_volume:
  media_volume:
