version: '3.3'
services:

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=carwager
      - POSTGRES_USER=carwager
      - POSTGRES_PASSWORD=carwager
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:latest

  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./carwager/:/app/
    depends_on:
      - redis
      - postgres
    links:
      - postgres
      - redis
    environment:
      # - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    command: |
      bash -c "python manage.py runserver 0.0.0.0:8000 && 
             python manage.py run_status_update &&
             python manage.py search_winners"
  worker:
    build: .
    volumes:
      - ./carwager/:/app/
    depends_on:
      - redis
      - postgres
    links:
      - postgres
      - redis
    environment:
     # - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    command: |
      python manage.py rqworker default
  sheduler:
    build: .
    volumes:
      - ./carwager/:/app/
    depends_on:
      - redis
      - postgres
    links:
      - postgres
      - redis
    environment:
      # - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    command: |
      python manage.py rqscheduler default
      
