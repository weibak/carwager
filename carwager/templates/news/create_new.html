{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Create News - CarWager{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white py-3">
          <h3 class="mb-0">Create News Article</h3>
          <p class="mb-0 small">Share automotive news with the CarWager community</p>
        </div>
        <div class="card-body p-4">
          <form enctype="multipart/form-data" method="POST" class="post-form">
            {% csrf_token %}
            {{ form | crispy }}
            
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-newspaper me-2"></i>Publish News
              </button>
              <a href="{% url 'news' %}" class="btn btn-outline-secondary">
                <i class="fas fa-times me-2"></i>Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
