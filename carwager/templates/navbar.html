{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'news' %}">
            <img src="{% static 'car.svg' %}" alt="" width="30" height="24" class="d-inline-block align-text-top">
            CarWager
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url "news" %}">News</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url "showbill" %}">Sale ads</a>

                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url "auction" %}">Auction</a>
                </li>
                {% if request.user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url "add_advert" %}">Create advert</a>
                    </li>
                    <li class="nav-item">

                    </li>

                        <a class="nav-link active" aria-current="page" href="{% url "logout" %}">Logout</a>

                    <li>
                        <a class="nav-link active" aria-current="page" href="{% url "auth" %}">Login</a>

                {% endif %}

                        <a class="nav-link active" aria-current="page"
