name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.8'
  POSTGRES_VERSION: '12'
  REDIS_VERSION: '6'

jobs:
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Ruff
      run: pip install ruff
    
    - name: Run Ruff linter
      run: ruff check --output-format=concise .
    
    - name: Run Ruff formatter check
      run: ruff format --check .
    
    - name: Check for Django security issues
      run: |
        pip install bandit safety
        bandit -r . -ll
        safety check -r requirements.txt

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: carwager
          POSTGRES_PASSWORD: carwager
          POSTGRES_DB: carwager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov
    
    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> .env.test
        echo "SECRET_KEY=test-secret-key-$(openssl rand -hex 32)" >> .env.test
        echo "POSTGRES_NAME=carwager_test" >> .env.test
        echo "POSTGRES_USER=carwager" >> .env.test
        echo "POSTGRES_PASS=carwager" >> .env.test
        echo "POSTGRES_HOST=localhost" >> .env.test
        echo "POSTGRES_PORT=5432" >> .env.test
        echo "REDIS_HOST=localhost" >> .env.test
        echo "REDIS_PORT=6379" >> .env.test
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env.test
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgres://carwager:carwager@localhost:5432/carwager_test
      run: |
        export $(cat .env.test | xargs)
        python manage.py migrate
    
    - name: Run tests with pytest
      env:
        DATABASE_URL: postgres://carwager:carwager@localhost:5432/carwager_test
      run: |
        export $(cat .env.test | xargs)
        pytest --cov=carwager --cov=showbill --cov=auction --cov=chat --cov=news --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Django image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/carwager-django:latest
          ${{ secrets.DOCKER_USERNAME }}/carwager-django:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Nginx image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/nginx/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/carwager-nginx:latest
          ${{ secrets.DOCKER_USERNAME }}/carwager-nginx:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'carwager'
        path: '.'
        format: 'HTML'
        out: 'reports'

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, docker-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Heroku
      if: success()
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        usedocker: true
    
    - name: Run database migrations on Heroku
      if: success()
      run: |
        heroku run --app ${{ secrets.HEROKU_APP_NAME }} python manage.py migrate
    
    - name: Collect static files on Heroku
      if: success()
      run: |
        heroku run --app ${{ secrets.HEROKU_APP_NAME }} python manage.py collectstatic --noinput

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build, security-scan, deploy]
    if: always()
    
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        author_name: GitHub Actions
        fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Create deployment status
      uses: bobheadxi/deployments@v1
      with:
        step: finish
        token: ${{ secrets.GITHUB_TOKEN }}
        env: Production
        description: |
          Lint: ${{ needs.lint.result }}
          Tests: ${{ needs.test.result }}
          Security: ${{ needs.security-scan.result }}
          Docker: ${{ needs.docker-build.result }}
          Deploy: ${{ needs.deploy.result }}