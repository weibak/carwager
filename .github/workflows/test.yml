name: Django Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.8'
  POSTGRES_VERSION: '12'
  REDIS_VERSION: '6'

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: carwager
          POSTGRES_PASSWORD: carwager
          POSTGRES_DB: carwager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django
    
    - name: Create test environment file
      run: |
        echo "DEBUG=True" > .env.test
        echo "SECRET_KEY=test-secret-key-$(openssl rand -hex 32)" >> .env.test
        echo "POSTGRES_NAME=carwager_test" >> .env.test
        echo "POSTGRES_USER=carwager" >> .env.test
        echo "POSTGRES_PASS=carwager" >> .env.test
        echo "POSTGRES_HOST=localhost" >> .env.test
        echo "POSTGRES_PORT=5432" >> .env.test
        echo "REDIS_HOST=localhost" >> .env.test
        echo "REDIS_PORT=6379" >> .env.test
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env.test
    
    - name: Run database migrations
      run: |
        export $(cat .env.test | xargs)
        python manage.py migrate
    
    - name: Run Django tests
      run: |
        export $(cat .env.test | xargs)
        python manage.py test
    
    - name: Check Django migrations
      run: |
        export $(cat .env.test | xargs)
        python manage.py makemigrations --check --dry-run
    
    - name: Check static files
      run: |
        export $(cat .env.test | xargs)
        python manage.py collectstatic --noinput --dry-run
