name: Django Tests

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  POSTGRES_VERSION: '12'
  REDIS_VERSION: '6'

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: carwager
          POSTGRES_PASSWORD: carwager
          POSTGRES_DB: carwager_test
        options: >-
          --health-cmd="pg_isready -U carwager -d carwager_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: redis:${{ env.REDIS_VERSION }}
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Create test environment
        run: |
          cat > .env.test << EOF
          DEBUG=True
          SECRET_KEY=test-secret-key
          POSTGRES_NAME=carwager_test
          POSTGRES_USER=carwager
          POSTGRES_PASS=carwager
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          REDIS_HOST=localhost
          REDIS_PORT=6379
          ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Load environment
        run: |
          set -a
          source .env.test
          set +a

          python -c "import os; print('POSTGRES_HOST=', os.getenv('POSTGRES_HOST'))"
          python -c "import os; print('POSTGRES_NAME=', os.getenv('POSTGRES_NAME'))"

      - name: Check Django configuration
        run: |
          set -a
          source .env.test
          set +a

          python manage.py check

      - name: Run migrations
        run: |
          set -a
          source .env.test
          set +a

          python manage.py migrate --noinput

      - name: Run tests
        run: |
          set -a
          source .env.test
          set +a

          python manage.py test --verbosity=2

      - name: Check migrations
        run: |
          set -a
          source .env.test
          set +a

          python manage.py makemigrations --check --dry-run

      - name: Check static files
        run: |
          set -a
          source .env.test
          set +a

          python manage.py collectstatic --noinput --dry-run
